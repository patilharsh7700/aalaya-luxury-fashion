<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salwar Suits & Ensembles | AALAYA Luxury Fashion</title>
  <meta name="description" content="Discover AALAYA's Begum Sahiba Chanderi salwar suits, Afghani pleated sets, and gharara ensembles.">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .salwar-hero {
      padding: 130px 2rem 50px;
      text-align: center;
      background: #f7f3ee;
      border-bottom: 1px solid var(--aalaya-border);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <button class="mobile-nav-toggle" onclick="toggleMobileMenu()"><i class="fa-solid fa-bars-staggered"></i></button>

      <a href="index.html" class="brand-wrapper">
        <span class="brand-logo">AALAYA</span>
        <span class="brand-submark">HAUTE COUTURE & PRET</span>
      </a>

      <nav class="desktop-nav-menu">
        <a href="new-arrivals.html" class="nav-link">New Arrivals</a>
        <a href="salwar-suits.html" class="nav-link active">Salwar Suits</a>
        <a href="sarees.html" class="nav-link">Sarees</a>
        <a href="kurtis.html" class="nav-link">Kurtis</a>
        <a href="ethnic-wear.html" class="nav-link">Ethnic Wear</a>
        <a href="sale.html" class="nav-link sale-tag">Sale</a>
      </nav>

      <div class="header-actions">
        <button class="nav-action-btn btn-trigger-search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="nav-action-btn btn-trigger-cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="badge-count cart-badge-count" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="salwar-hero">
    <span class="eyebrow">ROYAL COURT ATTIRE</span>
    <h1 style="margin:0.5rem 0 0.8rem;">Salwar Suits & Ensembles</h1>
    <p style="max-width:680px; margin:0 auto; color:#666;">
      Classic silhouettes combining Chanderi silks, Afghani pleats, and block-printed organza dupattas.
    </p>
  </div>

  <div class="container-fluid" style="max-width:var(--container-max); padding: 5rem 2rem 7rem;">
    <div class="product-grid-container" id="salwarGrid"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom-bar" style="justify-content:center;">
      <div>&copy; 2026 AALAYA HAUTE COUTURE. ALL RIGHTS RESERVED.</div>
    </div>
  </footer>

  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = AALAYA_PRODUCTS.filter(p => p.subCategory.includes('Salwar') || p.category === 'ethnic');
      const grid = document.getElementById('salwarGrid');
      if (grid) {
        grid.innerHTML = items.map(createProductCardHTML).join('');
        AalayaStore.syncWishlistButtons();
      }
    });
  </script>
</body>
</html>
