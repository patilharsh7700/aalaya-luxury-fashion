<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patron Sign In | AALAYA Luxury Fashion</title>
  <meta name="description" content="Sign in to your private AALAYA salon account for personalized bridal styling, bespoke orders, and private collection drops.">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .auth-container-wrap {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 2rem 5rem;
    }
    .auth-card {
      background: #fff;
      border: 1px solid var(--aalaya-border);
      max-width: 480px;
      width: 100%;
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-luxury);
      text-align: center;
    }
    .auth-toggle-tabs {
      display: flex;
      border-bottom: 1px solid var(--aalaya-border);
      margin-bottom: 2rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #999;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.25s;
    }
    .auth-tab-btn.active {
      color: var(--aalaya-charcoal);
      border-color: var(--aalaya-gold);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-container" style="justify-content:center;">
      <a href="index.html" class="brand-wrapper">
        <span class="brand-logo">AALAYA</span>
        <span class="brand-submark">HAUTE COUTURE & PRET</span>
      </a>
    </div>
  </header>

  <div class="auth-container-wrap">
    <div class="auth-card">
      <span class="eyebrow" style="justify-content:center;">PRIVATE SALON ACCESS</span>
      <h2 style="font-size:1.85rem; margin:0.4rem 0 1.5rem;" id="authHeaderTitle">Patron Sign In</h2>

      <div class="auth-toggle-tabs">
        <button class="auth-tab-btn active" onclick="toggleAuthMode('login', this)">Sign In</button>
        <button class="auth-tab-btn" onclick="toggleAuthMode('register', this)">Create Account</button>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='account.html';">
        <div style="margin-bottom:1.25rem; text-align:left;">
          <label style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:6px;">Email Address or Mobile</label>
          <input type="text" class="newsletter-input" style="border:1px solid #ccc; padding:12px; width:100%; color:var(--aalaya-charcoal);" value="radhika.singhania@heritage.in" required>
        </div>

        <div style="margin-bottom:1.25rem; text-align:left;">
          <div style="display:flex; justify-content:space-between;">
            <label style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px;">Password</label>
            <a href="#" style="font-size:0.75rem; color:var(--aalaya-gold); text-decoration:underline;">Forgot Password?</a>
          </div>
          <input type="password" class="newsletter-input" style="border:1px solid #ccc; padding:12px; width:100%; color:var(--aalaya-charcoal);" value="••••••••••••" required>
        </div>

        <button type="submit" class="btn-luxury-primary" style="width:100%; margin-top:1rem;">
          <span>Enter Private Salon</span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none;" onsubmit="event.preventDefault(); showAalayaToast('Welcome to Aalaya Salon. Your membership is active.'); setTimeout(() => window.location.href='account.html', 1000);">
        <div style="margin-bottom:1rem; text-align:left;">
          <label style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:4px;">Full Name</label>
          <input type="text" style="border:1px solid #ccc; padding:10px; width:100%;" required>
        </div>

        <div style="margin-bottom:1rem; text-align:left;">
          <label style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:4px;">Email Address</label>
          <input type="email" style="border:1px solid #ccc; padding:10px; width:100%;" required>
        </div>

        <div style="margin-bottom:1rem; text-align:left;">
          <label style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:4px;">Mobile / WhatsApp</label>
          <input type="tel" style="border:1px solid #ccc; padding:10px; width:100%;" required>
        </div>

        <div style="margin-bottom:1.5rem; text-align:left;">
          <label style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; display:block; margin-bottom:4px;">Create Password</label>
          <input type="password" style="border:1px solid #ccc; padding:10px; width:100%;" required>
        </div>

        <button type="submit" class="btn-luxury-primary" style="width:100%;">
          <span>Join Private Salon</span>
        </button>
      </form>

      <div style="margin-top:2rem; font-size:0.8rem; color:#777;">
        By continuing, you agree to AALAYA's <a href="privacy-terms.html" style="text-decoration:underline;">Terms of Service</a> & <a href="privacy-terms.html" style="text-decoration:underline;">Privacy Policy</a>.
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom-bar" style="border-top:none; justify-content:center;">
      <div>&copy; 2026 AALAYA HAUTE COUTURE. ALL RIGHTS RESERVED.</div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    function toggleAuthMode(mode, btn) {
      document.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (mode === 'login') {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('authHeaderTitle').textContent = 'Patron Sign In';
      } else {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('authHeaderTitle').textContent = 'Join Private Salon';
      }
    }
  </script>
</body>
</html>
